services:
  - type: web
    name: cognicare-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: cognicare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_MOCK_AI
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000","https://cognicare-frontend-xi.vercel.app","https://cognicare-frontend-deepanshus-projects-13620ecc.vercel.app"]'

databases:
  - name: cognicare-db
    databaseName: cognicare
    user: postgres
    plan: free
